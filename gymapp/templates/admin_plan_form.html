{% extends 'base.html' %}


{% block content %}

<h2 class="mb-3">
    {% if mode == 'add' %} Add Plan {% else %} Edit Plan {% endif %}
</h2>

<form method="post" class="row g-3 w-75">
{% csrf_token %}
<div class="col-md-6">
    <label class="form-label">Plan Name*</label>
    <input type="text" name="name" class="form-control" value="{{plan.name|default:''}}">
</div>
<div class="col-md-3">
    <label class="form-label">Duration (in months)*</label>
    <input type="number" min="1" max="12" name="duration_months" class="form-control" value="{{plan.duration_months|default:''}}">
</div>
<div class="col-md-3">
    <label class="form-label">Fee*</label>
    <input type="number" step = "0.1" name="fee" class="form-control" value="{{plan.fee|default:''}}">
</div>
<div class="col-md-6">
    <label class="form-label">Description/Features</label>
    <textarea name="description" class="form-control" rows="3">{{plan.description|default:''}}</textarea>
</div>

<div class="col-md-12">
    <button type="submit" class="btn btn-primary">
        {% if mode == 'add' %} Add Plan {% else %} Update Plan {% endif %}
    </button>
    <a href="{% url 'admin_plans_list' %}" class="btn btn-secondary">Cancel</a>
</div>
</form>

{% endblock %}
